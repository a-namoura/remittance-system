name: Production configuration review

on:
  pull_request:
    branches: [main]
    paths:
      - ".env.example"
      - "**/.env.example"
      - "backend/src/config/**"
      - "backend/src/server.js"
      - "frontend/src/services/api.js"
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/production-config-review.yml"
      - ".github/scripts/check-production-config.mjs"
      - "docs/production-config-review.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-config-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-config-review:
    name: Production configuration approval
    runs-on: ubuntu-latest
    # Configure the repository's "production" environment with required reviewers.
    # This job intentionally has no environment secrets available to it.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            contracts/package-lock.json
      - name: Enforce configuration and secret boundaries
        run: node .github/scripts/check-production-config.mjs
      - name: Verify locked dependencies
        run: |
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend
          npm ci --ignore-scripts --prefix contracts
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --prefix backend
          npm audit --omit=dev --audit-level=high --prefix frontend
          npm audit --omit=dev --audit-level=high --prefix contracts
  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
