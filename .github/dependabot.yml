version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
      - /contracts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      non-major-updates:
        update-types: [minor, patch]
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(actions)"
  - package-ecosystem: docker
    directory: /backend
    # Node major upgrades must update .nvmrc, engines and both images together.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: docker
    directory: /frontend
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(docker)"
